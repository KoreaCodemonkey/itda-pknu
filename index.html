<!DOCTYPE html>

<head>

  <!-- Tailwind CSS -->

  <!-- Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

      -ms-overflow-style: none;
      scrollbar-width: none;
    }

      background-color: #F4F5F7;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;

<body class="font-sans text-slate-900 antialiased flex justify-center min-h-screen">

            <input
              id="search-input"
              type="text"
              oninput="handleSearchInput()"

            />

              id="clear-search-btn"
              onclick="clearSearch()"
              class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1"
            >
              <i data-lucide="x-circle" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

            </div>
          </div>

          <!-- 안내 문구 -->

    // ==================== NAVIGATION ====================

      ['home', 'chat'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
      });
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.dataset.tab === tabName;
        btn.classList.toggle('text-slate-900', isActive);
        btn.classList.toggle('font-extrabold', isActive);
        btn.classList.toggle('text-slate-400', !isActive);
      });

      document.getElementById('main-content').scrollTop = 0;
      lucide.createIcons();
    }

      renderItemsList();
    }

    // ==================== 4 MAIN CATEGORY CARDS & SUB-CATEGORY TOGGLE ====================
    function renderMainCategoryCards() {
      const grid = document.getElementById('category-cards-grid');
      grid.innerHTML = mainCategories.map(cat => {
        const isSelected = selectedMainCat === cat.id;
        return `
          <button
            type="button"
            onclick="handleMainCategoryClick('${cat.id}')"
            class="relative text-left p-4 rounded-2xl border transition-all duration-150 flex flex-col justify-between min-h-[124px] active:scale-[0.98] ${
              isSelected
                ? 'bg-emerald-50/40 border-emerald-500 ring-2 ring-emerald-500/15 shadow-xs'
                : 'bg-white border-slate-200/90 hover:border-slate-300'
            }"
          >
            <div>
              <div class="w-7 h-7 flex items-center justify-start text-slate-800 mb-2">
                <i data-lucide="${cat.icon}" class="w-5 h-5 stroke-[1.9]"></i>
              </div>
              <h3 class="text-[15.5px] font-extrabold text-slate-900 tracking-tight">
                ${cat.title}
              </h3>
              <p class="text-[11px] text-slate-400 mt-0.5 leading-snug">
                ${cat.subtitle}
              </p>
            </div>

            <!-- 우측 하단 아래 화살표 ∨ 아이콘 -->
            <div class="flex justify-end mt-2">
              <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform duration-200 ${isSelected ? 'rotate-180 text-emerald-600' : ''}"></i>
            </div>
          </button>
        `;
      }).join('');

      lucide.createIcons();
    }

    function handleMainCategoryClick(catId) {
      if (selectedMainCat === catId) {
        // 같은 카드 재클릭 시 하위 분류 서랍 토글
        const drawer = document.getElementById('sub-category-drawer');
        const isHidden = drawer.classList.contains('hidden');
        if (isHidden) {
          drawer.classList.remove('hidden');
        } else {
          selectedMainCat = null;
          selectedSubCat = '전체';
          drawer.classList.add('hidden');
        }
      } else {
        selectedMainCat = catId;
        selectedSubCat = '전체';
        renderSubCategoryDrawer();
        // 물품 목록 토글도 자동으로 펼쳐서 필터링 결과 표시
        isAccordionOpen = true;
        updateAccordionUI();
      }

      renderMainCategoryCards();
      renderItemsList();
    }

    function renderSubCategoryDrawer() {
      const catObj = mainCategories.find(c => c.id === selectedMainCat);
      const drawer = document.getElementById('sub-category-drawer');
      if (!catObj) {
        drawer.classList.add('hidden');
        return;
      }

      document.getElementById('sub-drawer-title').textContent = `${catObj.title} 하위 분류`;
      const chipsContainer = document.getElementById('sub-category-chips');

      chipsContainer.innerHTML = catObj.subItems.map(sub => {
        const active = selectedSubCat === sub;
        return `
          <button
            type="button"
            onclick="selectSubCategory('${sub}')"
            class="px-3 py-1.5 rounded-full text-xs font-bold transition ${
              active
                ? 'bg-slate-900 text-white shadow-2xs'
                : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
            }"
          >
            ${sub}
          </button>
        `;
      }).join('');

      drawer.classList.remove('hidden');
    }

    function selectSubCategory(sub) {
      selectedSubCat = sub;
      isAccordionOpen = true;
      updateAccordionUI();
      renderSubCategoryDrawer();
      renderItemsList();
    }

    function closeSubCategoryDrawer() {
      selectedMainCat = null;
      selectedSubCat = '전체';
      document.getElementById('sub-category-drawer').classList.add('hidden');
      renderMainCategoryCards();
      renderItemsList();
    }

    // ==================== SEARCH & ACCORDION TOGGLE ====================
    function handleSearchInput() {
      const val = document.getElementById('search-input').value;
      const clearBtn = document.getElementById('clear-search-btn');
      clearBtn.classList.toggle('hidden', val.length === 0);

      // 검색어 입력 시 대여 물품 목록 토글 자동 펼침
      if (val.trim().length > 0 && !isAccordionOpen) {
        isAccordionOpen = true;
        updateAccordionUI();
      }
      renderItemsList();
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      renderItemsList();
    }

    function toggleItemsAccordion() {
      isAccordionOpen = !isAccordionOpen;
      updateAccordionUI();
    }

    function updateAccordionUI() {
      const body = document.getElementById('items-accordion-body');
      const chevron = document.getElementById('accordion-chevron');

      if (isAccordionOpen) {
        body.classList.remove('hidden');
        chevron.classList.add('rotate-180');
      } else {
        body.classList.add('hidden');
        chevron.classList.remove('rotate-180');
      }
    }

    // ==================== LOCATION PILLS & ITEMS LIST ====================
    function renderLocationPills() {
      const container = document.getElementById('location-pills');
      container.innerHTML = locations.map(loc => {
        const active = selectedLocation === loc;
        return `
          <button
            type="button"
            onclick="selectLocation('${loc}')"
            class="shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
              active
                ? 'bg-slate-900 text-white'
                : 'bg-slate-100 text-slate-600 hover:bg-slate-200/70'
            }"
          >
            ${loc}
          </button>
        `;
      }).join('');
    }

    function selectLocation(loc) {
      selectedLocation = loc;
      renderLocationPills();
      renderItemsList();
    }

    function resetAllFilters() {
      selectedMainCat = null;
      selectedSubCat = '전체';
      selectedLocation = '전체';
      document.getElementById('search-input').value = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      document.getElementById('sub-category-drawer').classList.add('hidden');
      renderMainCategoryCards();
      renderLocationPills();
      renderItemsList();
    }

    function renderItemsList() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();

      const filtered = rentalItems.filter(item => {
        const matchMain = !selectedMainCat || item.mainCat === selectedMainCat;
        const matchSub = selectedSubCat === '전체' || item.subCat === selectedSubCat;
        const matchLoc = selectedLocation === '전체' || item.location === selectedLocation;
        const matchQuery =
          !query ||
          item.name.toLowerCase().includes(query) ||
          item.subCat.toLowerCase().includes(query) ||
          item.location.includes(query);
        return matchMain && matchSub && matchLoc && matchQuery;
      });

      // 토글 헤더 카운트 및 필터 배지 업데이트
      document.getElementById('total-filtered-count').textContent = `총 ${filtered.length}개`;

      const badgeEl = document.getElementById('active-filter-badge');
      if (!selectedMainCat && selectedLocation === '전체') {
        badgeEl.textContent = '전체';
      } else {
        const catObj = mainCategories.find(c => c.id === selectedMainCat);
        const parts = [];
        if (catObj) {
          parts.push(selectedSubCat !== '전체' ? selectedSubCat : catObj.title);
        }
        if (selectedLocation !== '전체') {
          parts.push(selectedLocation);
        }
        badgeEl.textContent = parts.join(' · ');
      }

      const container = document.getElementById('items-list');

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="py-7 text-center bg-slate-50 rounded-xl border border-slate-100">
            <p class="text-xs font-bold text-slate-700">조건에 맞는 물품이 없습니다</p>
            <p class="text-[11px] text-slate-400 mt-1">다른 카테고리나 대여 장소를 선택해 보세요.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div
          onclick="openItemModal(${item.id})"
          class="p-3 rounded-xl border border-slate-200/80 bg-white hover:border-emerald-400 transition cursor-pointer flex items-center justify-between gap-3 active:scale-[0.99]"
        >
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-11 h-11 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center shrink-0">
              <i data-lucide="${item.icon}" class="w-5 h-5"></i>
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5 mb-0.5">
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">
                  ${item.location}
                </span>
                <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700">
                  ${item.subCat}
                </span>
              </div>
              <h4 class="text-[13px] font-extrabold text-slate-900 truncate">${item.name}</h4>
              <p class="text-[11px] text-slate-400 truncate mt-0.5">
                ${item.ownerName} · ${item.ownerPhone}
              </p>
            </div>
          </div>
          <span class="shrink-0 px-2.5 py-1.5 rounded-lg text-[11px] font-bold ${
            item.available ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-400'
          }">
            ${item.available ? '대여' : '대여중'}
          </span>
        </div>
      `).join('');

      lucide.createIcons();
    }

    // ==================== ITEM DETAIL MODAL (대여 기간: 1일, 2일, 3일 & 연락처 채팅) ====================
    function openItemModal(itemId) {
      const item = rentalItems.find(i => i.id === itemId);
      if (!item) return;

      selectedDuration = '1일';
      const modalBody = document.getElementById('item-modal-body');

      modalBody.innerHTML = `
        <div class="flex items-start justify-between gap-3 mb-3.5">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-800 flex items-center justify-center shrink-0">
              <i data-lucide="${item.icon}" class="w-6 h-6"></i>
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-700">${item.location}</span>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700">${item.subCat}</span>
              </div>
              <h3 class="font-extrabold text-[15px] text-slate-900 mt-1">${item.name}</h3>
            </div>
          </div>
          <button onclick="closeItemModal()" class="p-1.5 rounded-full hover:bg-slate-100 text-slate-400">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <p class="text-xs text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100 mb-4">
          ${item.desc}
        </p>

        <!-- 등록자 연락처 확인 및 복사/전화 -->
        <div class="bg-emerald-50/60 border border-emerald-200/80 rounded-2xl p-3.5 mb-4 flex items-center justify-between gap-2">
          <div class="min-w-0">
            <p class="text-[10.5px] text-emerald-700 font-bold">등록자 연락처</p>
            <p class="text-[13px] font-extrabold text-slate-900 truncate mt-0.5">${item.ownerName}</p>
            <p class="text-xs font-mono font-bold text-slate-700 mt-0.5">${item.ownerPhone}</p>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button type="button" onclick="copyPhoneNumber('${item.ownerPhone}')" class="px-2.5 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 text-[11px] font-bold active:scale-95 transition">
              번호복사
            </button>
            <a href="tel:${item.ownerPhone}" class="px-2.5 py-2 rounded-xl bg-emerald-600 text-white text-[11px] font-bold flex items-center gap-1 active:scale-95 transition">
              <i data-lucide="phone" class="w-3 h-3"></i>
              전화
            </a>
          </div>
        </div>

        <!-- 물품 대여 기간 (1일, 2일, 3일만 제공) -->
        <div class="mb-5">
          <label class="block text-xs font-extrabold text-slate-800 mb-2">
            대여 기간 선택
          </label>
          <div class="grid grid-cols-3 gap-2">
            ${rentalDurations.map(dur => `
              <button
                type="button"
                onclick="selectDuration('${dur}')"
                data-dur="${dur}"
                class="dur-btn py-2.5 rounded-xl text-xs font-extrabold border transition ${
                  dur === '1일'
                    ? 'bg-slate-900 text-white border-slate-900'
                    : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                }"
              >
                ${dur}
              </button>
            `).join('')}
          </div>
        </div>

        <button
          type="button"
          onclick="startChatWithOwner(${item.id})"
          class="w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm active:scale-[0.99] transition"
        >
          <i data-lucide="message-circle" class="w-4 h-4 text-emerald-400"></i>
          연락처로 채팅하기 (${selectedDuration} 대여 문의)
        </button>
      `;

      document.getElementById('item-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function selectDuration(dur) {
      selectedDuration = dur;
      document.querySelectorAll('.dur-btn').forEach(btn => {
        const isTarget = btn.dataset.dur === dur;
        btn.className = `dur-btn py-2.5 rounded-xl text-xs font-extrabold border transition ${
          isTarget
            ? 'bg-slate-900 text-white border-slate-900'
            : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
        }`;
      });
      // 하단 버튼 텍스트의 대여 기간도 실시간 반영
      const chatBtn = document.querySelector('#item-modal-body button[onclick^="startChatWithOwner"]');
      if (chatBtn) {
        chatBtn.innerHTML = `
          <i data-lucide="message-circle" class="w-4 h-4 text-emerald-400"></i>
          연락처로 채팅하기 (${selectedDuration} 대여 문의)
        `;
        lucide.createIcons();
      }
    }

    function closeItemModal() {
      document.getElementById('item-modal').classList.add('hidden');
    }

    // ==================== CONTACT-BASED CHAT LOGIC ====================
    function startChatWithOwner(itemId) {
      const item = rentalItems.find(i => i.id === itemId);
      if (!item) return;

      let room = chatRooms.find(r => r.itemId === item.id);
      if (!room) {
        room = {
          id: Date.now(),
          itemId: item.id,
          itemName: item.name,
          location: item.location,
          ownerName: item.ownerName,
          ownerPhone: item.ownerPhone,
          messages: [
            {
              sender: 'other',
              text: `안녕하세요! ${item.ownerName}입니다. [${item.name}] 대여 문의 주시면 ${item.location}에서 전달해드릴게요.`,
              time: getCurrentTime()
            }
          ]
        };
        chatRooms.unshift(room);
      }

      room.messages.push({
        sender: 'me',
        text: `안녕하세요! [${item.name}] ${selectedDuration} 대여하고 싶습니다. ${item.location}에서 뵐 수 있을까요?`,
        time: getCurrentTime()
      });

      activeChatRoomId = room.id;
      closeItemModal();
      renderChatRooms();
      renderActiveChat();
      switchTab('chat');
    }

    function renderChatRooms() {
      const container = document.getElementById('chat-room-list');
      container.innerHTML = chatRooms.map(room => {
        const isActive = room.id === activeChatRoomId;
        return `
          <button
            onclick="selectChatRoom(${room.id})"
            class="shrink-0 px-3 py-2 rounded-xl border text-left transition ${
              isActive
                ? 'bg-slate-900 text-white border-slate-900 shadow-2xs'
                : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
            }"
          >
            <p class="text-xs font-extrabold">${room.ownerName.split(' ')[0]} · ${room.location}</p>
            <p class="text-[10px] ${isActive ? 'text-emerald-300' : 'text-slate-400'} truncate max-w-[130px]">
              ${room.itemName}
            </p>
          </button>
        `;
      }).join('');
    }

    function selectChatRoom(roomId) {
      activeChatRoomId = roomId;
      renderChatRooms();
      renderActiveChat();
    }

    function renderActiveChat() {
      const room = chatRooms.find(r => r.id === activeChatRoomId) || chatRooms[0];
      if (!room) return;

      const headerEl = document.getElementById('active-contact-header');
      headerEl.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="text-xs font-extrabold text-slate-900 truncate">${room.ownerName}</span>
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-white text-emerald-700 border border-emerald-200">${room.location}</span>
            </div>
            <p class="text-xs font-mono font-bold text-slate-700 mt-0.5 flex items-center gap-1">
              <i data-lucide="phone" class="w-3 h-3 text-emerald-600"></i>
              ${room.ownerPhone}
            </p>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button
              type="button"
              onclick="copyPhoneNumber('${room.ownerPhone}')"
              class="px-2.5 py-1.5 rounded-xl bg-white border border-slate-200 text-slate-700 text-[11px] font-bold active:scale-95 transition"
            >
              연락처 복사
            </button>
            <a
              href="tel:${room.ownerPhone}"
              class="px-2.5 py-1.5 rounded-xl bg-emerald-600 text-white text-[11px] font-bold flex items-center gap-1 active:scale-95 transition"
            >
              <i data-lucide="phone-call" class="w-3 h-3"></i>
              전화
            </a>
          </div>
        </div>
      `;

      const msgBox = document.getElementById('chat-messages');
      msgBox.innerHTML = room.messages.map(m => {
        if (m.sender === 'me') {
          return `
            <div class="flex flex-col items-end">
              <span class="text-[10px] text-slate-400 mb-0.5">나 · ${m.time}</span>
              <div class="bg-slate-900 text-white px-3.5 py-2.5 rounded-2xl rounded-tr-xs text-xs leading-relaxed shadow-2xs max-w-[82%]">
                ${m.text}
              </div>
            </div>
          `;
        }
        return `
          <div class="flex flex-col items-start">
            <span class="text-[10px] text-slate-400 mb-0.5">${room.ownerName} · ${m.time}</span>
            <div class="bg-white border border-slate-200/90 text-slate-800 px-3.5 py-2.5 rounded-2xl rounded-tl-xs text-xs leading-relaxed shadow-2xs max-w-[82%]">
              ${m.text}
            </div>
          </div>
        `;
      }).join('');

      msgBox.scrollTop = msgBox.scrollHeight;
      lucide.createIcons();
    }

    function sendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const room = chatRooms.find(r => r.id === activeChatRoomId);
      if (!room) return;

      room.messages.push({
        sender: 'me',
        text,
        time: getCurrentTime()
      });

      input.value = '';
      renderActiveChat();
    }

    function shareMyContact() {
      const room = chatRooms.find(r => r.id === activeChatRoomId);
      if (!room) return;

      room.messages.push({
        sender: 'me',
        text: '📱 [내 번호 전송] 부경대 재학생 / 010-7788-1234 (급하시면 문자나 전화 주세요!)',
        time: getCurrentTime()
      });
      renderActiveChat();
      showToast('내 연락처 정보가 채팅창에 전송되었습니다.');
    }

    function insertQuickText(text) {
      const input = document.getElementById('chat-input');
      input.value = text;
      input.focus();
    }

    // ==================== UTILITIES ====================
    function getCurrentTime() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function copyPhoneNumber(phone) {
      const tempInput = document.createElement('input');
      tempInput.value = phone;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      showToast(`연락처(${phone})가 복사되었습니다.`);
    }

    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2400);
    }
  </script>
</body>
</html>
