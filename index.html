      { name: '장우산 (3단 방풍 우산)', category: '생활용품', subCategory: '우산', location: '중앙도서관', quantity: 2, ownerName: '김민수', icon: 'umbrella', desc: '갑자기 비 올 때 중앙도서관 1층 정문 앞에서 바로 빌려드립니다.' }
    ];

    // ==================== STATE VARIABLES ====================
    let rentalItems = [];
    let chatRooms = [];
    let selectedCategory = '전체';
    let selectedSubCategory = '전체';
    let selectedLocation = '전체';
    let selectedDuration = '1일';
    let activeChatRoomId = null;
    let uploadSelectedCategory = '전자기기';
    let uploadSelectedLocation = '백경광장';
    let seededOnce = false;

    // ==================== INITIALIZATION & REALTIME LISTENERS ====================
    document.addEventListener('DOMContentLoaded', () => {
      renderCategoryTabs();
      renderLocationPills();
      renderItemsList();
      renderUploadFormOptions();
      renderChatRooms();
      renderActiveChat();
      lucide.createIcons();

      // Firestore 'items' 실시간 구독
      const qItems = query(collection(db, "items"), orderBy("createdAt", "desc"));
      onSnapshot(qItems, async (snap) => {
        if (snap.empty && !seededOnce) {
          seededOnce = true;
          for (const item of initialItems) {
            await addDoc(collection(db, "items"), {
              ...item,
              createdAt: serverTimestamp()
            });
          }
          return;
        }
        rentalItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderItemsList();
      });

      // Firestore 'chatRooms' 실시간 구독
      const qRooms = query(collection(db, "chatRooms"), orderBy("updatedAt", "desc"));
      onSnapshot(qRooms, (snap) => {
        chatRooms = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (!activeChatRoomId && chatRooms.length > 0) {
          activeChatRoomId = chatRooms[0].id;
        }
        renderChatRooms();
        renderActiveChat();
      });
    });

    // ==================== NAVIGATION ====================
    window.switchTab = function(tabName) {
      ['home', 'upload', 'chat'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
      });
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.dataset.tab === tabName;
        btn.classList.toggle('text-slate-900', isActive);
        btn.classList.toggle('font-extrabold', isActive);
        btn.classList.toggle('text-slate-400', !isActive);
      });

      document.getElementById('main-content').scrollTop = 0;
      lucide.createIcons();
    };

    // ==================== CATEGORY & LOCATION FILTERS ====================
    function renderCategoryTabs() {
      const container = document.getElementById('category-tabs');
      container.innerHTML = categoryGroups.map(cat => {
        const active = selectedCategory === cat.id;
        return `
          <button
            type="button"
            onclick="selectCategory('${cat.id}')"
            class="shrink-0 px-3.5 py-2 rounded-full text-xs font-extrabold transition ${
              active
                ? 'bg-slate-900 text-white shadow-2xs'
                : 'bg-slate-100 text-slate-600 hover:bg-slate-200/70'
            }"
          >
            ${cat.label}
          </button>
        `;
      }).join('');
      renderSubCategoryChips();
    }

    function renderSubCategoryChips() {
      const catObj = categoryGroups.find(c => c.id === selectedCategory);
      const container = document.getElementById('sub-category-chips');
      if (!catObj || catObj.subItems.length === 0) {
        container.classList.add('hidden');
        container.innerHTML = '';
        return;
      }
      container.classList.remove('hidden');
      container.innerHTML = catObj.subItems.map(sub => {
        const active = selectedSubCategory === sub;
        return `
          <button
            type="button"
            onclick="selectSubCategory('${sub}')"
            class="shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold border transition ${
              active
                ? 'bg-emerald-50 text-emerald-700 border-emerald-300'
                : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'
            }"
          >
            ${sub}
          </button>
        `;
      }).join('');
    }

    window.selectCategory = function(catId) {
      selectedCategory = catId;
      selectedSubCategory = '전체';
      renderCategoryTabs();
      renderItemsList();
    };

    window.selectSubCategory = function(sub) {
      selectedSubCategory = sub;
      renderSubCategoryChips();
      renderItemsList();
    };

    function renderLocationPills() {
      const container = document.getElementById('location-pills');
      container.innerHTML = locations.map(loc => {
        const active = selectedLocation === loc;
        return `
          <button
            type="button"
            onclick="selectLocation('${loc}')"
            class="shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
              active
                ? 'bg-emerald-600 text-white'
                : 'bg-slate-100 text-slate-600 hover:bg-slate-200/70'
            }"
          >
            ${loc}
          </button>
        `;
      }).join('');
    }

    window.selectLocation = function(loc) {
      selectedLocation = loc;
      renderLocationPills();
      renderItemsList();
    };

    window.handleSearchInput = function() {
      const val = document.getElementById('search-input').value;
      document.getElementById('clear-search-btn').classList.toggle('hidden', val.length === 0);
      renderItemsList();
    };

    window.clearSearch = function() {
      document.getElementById('search-input').value = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      renderItemsList();
    };

    // ==================== ITEMS LIST RENDERING ====================
    function renderItemsList() {
      const queryText = (document.getElementById('search-input')?.value || '').trim().toLowerCase();

      const filtered = rentalItems.filter(item => {
        const matchCat = selectedCategory === '전체' || item.category === selectedCategory;
        const matchSub = selectedSubCategory === '전체' || item.subCategory === selectedSubCategory;
        const matchLoc = selectedLocation === '전체' || item.location === selectedLocation;
        const matchQuery =
          !queryText ||
          (item.name || '').toLowerCase().includes(queryText) ||
          (item.category || '').toLowerCase().includes(queryText) ||
          (item.subCategory || '').toLowerCase().includes(queryText) ||
          (item.location || '').includes(queryText);
        return matchCat && matchSub && matchLoc && matchQuery;
      });

      document.getElementById('item-count-label').textContent = `총 ${filtered.length}개`;
      const container = document.getElementById('items-list');

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="py-10 text-center bg-slate-50 rounded-2xl border border-slate-100">
            <p class="text-xs font-bold text-slate-700">조건에 맞는 물품이 없습니다</p>
            <p class="text-[11px] text-slate-400 mt-1">다른 카테고리나 대여 장소를 선택하거나 직접 등록해 보세요.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div
          onclick="openItemModal('${item.id}')"
          class="p-3.5 rounded-2xl border border-slate-200/80 bg-white hover:border-emerald-400 transition cursor-pointer flex items-center justify-between gap-3 active:scale-[0.99]"
        >
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-11 h-11 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center shrink-0">
              <i data-lucide="${item.icon || 'package'}" class="w-5 h-5"></i>
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5 mb-0.5 flex-wrap">
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">
                  ${escapeHtml(item.location)}
                </span>
                <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700">
                  ${escapeHtml(item.subCategory)}
                </span>
                <span class="text-[10px] font-medium text-slate-400">
                  수량 ${item.quantity}개
                </span>
              </div>
              <h4 class="text-[13.5px] font-extrabold text-slate-900 truncate">${escapeHtml(item.name)}</h4>
              <p class="text-[11px] text-slate-500 truncate mt-0.5">
                등록자: <span class="font-semibold text-slate-700">${escapeHtml(item.ownerName)}</span>
              </p>
            </div>
          </div>
          <button
            type="button"
            onclick="event.stopPropagation(); openItemModal('${item.id}')"
            class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-900 hover:bg-slate-800 text-white transition"
          >
            대여
          </button>
        </div>
      `).join('');

      lucide.createIcons();
    }

    // ==================== UPLOAD ITEM FORM LOGIC (FIRESTORE) ====================
    function renderUploadFormOptions() {
      const uploadCats = ['전자기기', '학습용품', '건강/위생용품', '생활용품'];
      const catGrid = document.getElementById('upload-cat-grid');
      catGrid.innerHTML = uploadCats.map(cat => {
        const active = uploadSelectedCategory === cat;
        return `
          <button
            type="button"
            onclick="selectUploadCategory('${cat}')"
            class="py-2.5 px-3 rounded-xl text-xs font-extrabold border transition ${
              active
                ? 'bg-slate-900 text-white border-slate-900'
                : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
            }"
          >
            ${cat}
          </button>
        `;
      }).join('');

      const locGrid = document.getElementById('upload-loc-grid');
      locGrid.innerHTML = uploadLocations.map(loc => {
        const active = uploadSelectedLocation === loc;
        return `
          <button
            type="button"
            onclick="selectUploadLocation('${loc}')"
            class="py-2.5 px-2 rounded-xl text-xs font-extrabold border transition ${
              active
                ? 'bg-emerald-600 text-white border-emerald-600'
                : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
            }"
          >
            ${loc}
          </button>
        `;
      }).join('');
    }

    window.selectUploadCategory = function(cat) {
      uploadSelectedCategory = cat;
      renderUploadFormOptions();
    };

    window.selectUploadLocation = function(loc) {
      uploadSelectedLocation = loc;
      renderUploadFormOptions();
    };

    function getCategoryIcon(cat) {
      const map = {
        '전자기기': 'smartphone',
        '학습용품': 'calculator',
        '건강/위생용품': 'heart-pulse',
        '생활용품': 'umbrella'
      };
      return map[cat] || 'package';
    }

    window.handleUploadSubmit = async function(e) {
      e.preventDefault();

      const ownerName = document.getElementById('upload-owner').value.trim();
      const itemName = document.getElementById('upload-name').value.trim();
      const quantity = parseInt(document.getElementById('upload-qty').value, 10) || 1;
      const descInput = document.getElementById('upload-desc').value.trim();

      if (!ownerName || !itemName) {
        showToast('등록자 이름과 세부 물품명을 입력해 주세요.');
        return;
      }

      const catGroup = categoryGroups.find(c => c.id === uploadSelectedCategory);
      let matchedSub = uploadSelectedCategory;
      if (catGroup && catGroup.subItems.length > 0) {
        const found = catGroup.subItems.find(
          sub => sub !== '전체' && itemName.toLowerCase().includes(sub.toLowerCase())
        );
        if (found) matchedSub = found;
      }

      const newItem = {
        name: itemName,
        category: uploadSelectedCategory,
        subCategory: matchedSub,
        location: uploadSelectedLocation,
        quantity,
        ownerName,
        icon: getCategoryIcon(uploadSelectedCategory),
        desc: descInput || `${uploadSelectedLocation}에서 대여 가능합니다. 채팅으로 편하게 문의해 주세요.`,
        createdAt: serverTimestamp()
      };

      await addDoc(collection(db, "items"), newItem);

      document.getElementById('upload-form').reset();
      document.getElementById('upload-qty').value = 1;
      uploadSelectedCategory = '전자기기';
      uploadSelectedLocation = '백경광장';
      renderUploadFormOptions();

      selectedCategory = '전체';
      selectedSubCategory = '전체';
      selectedLocation = '전체';
      renderCategoryTabs();
      renderLocationPills();

      switchTab('home');
      showToast(`'${newItem.name}' 물품이 등록되었습니다!`);
    };

    // ==================== ITEM DETAIL MODAL ====================
    window.openItemModal = function(itemId) {
      const item = rentalItems.find(i => i.id === itemId);
      if (!item) return;

      selectedDuration = '1일';
      const modalBody = document.getElementById('item-modal-body');

      modalBody.innerHTML = `
        <div class="flex items-start justify-between gap-3 mb-3.5">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-800 flex items-center justify-center shrink-0">
              <i data-lucide="${item.icon || 'package'}" class="w-6 h-6"></i>
            </div>
            <div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-700">${escapeHtml(item.location)}</span>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700">${escapeHtml(item.subCategory)}</span>
                <span class="text-[11px] font-semibold text-slate-400">수량 ${item.quantity}개</span>
              </div>
              <h3 class="font-extrabold text-[15.5px] text-slate-900 mt-1">${escapeHtml(item.name)}</h3>
            </div>
          </div>
          <button type="button" onclick="closeItemModal()" class="p-1.5 rounded-full hover:bg-slate-100 text-slate-400">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <p class="text-xs text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100 mb-4">
          ${escapeHtml(item.desc)}
        </p>

        <div class="bg-emerald-50/60 border border-emerald-200/80 rounded-2xl p-3.5 mb-4 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-full bg-white border border-emerald-200 text-emerald-700 flex items-center justify-center font-extrabold text-xs">
              ${escapeHtml(item.ownerName.charAt(0))}
            </div>
            <div>
              <p class="text-[10.5px] text-emerald-700 font-bold">대여 등록자</p>
              <p class="text-[13.5px] font-extrabold text-slate-900">${escapeHtml(item.ownerName)}</p>
            </div>
          </div>
          <span class="text-[11px] font-semibold text-slate-500 bg-white px-2.5 py-1 rounded-lg border border-slate-200/80">
            실시간 채팅 연결
          </span>
        </div>

        <div class="mb-5">
          <label class="block text-xs font-extrabold text-slate-800 mb-2">
            대여 기간 선택
          </label>
          <div class="grid grid-cols-3 gap-2">
            ${rentalDurations.map(dur => `
              <button
                type="button"
                onclick="selectDuration('${dur}')"
                data-dur="${dur}"
                class="dur-btn py-2.5 rounded-xl text-xs font-extrabold border transition ${
                  dur === '1일'
                    ? 'bg-slate-900 text-white border-slate-900'
                    : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                }"
              >
                ${dur}
              </button>
            `).join('')}
          </div>
        </div>

        <button
          id="modal-chat-btn"
          type="button"
          onclick="startChatWithOwner('${item.id}')"
          class="w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm active:scale-[0.99] transition"
        >
          <i data-lucide="message-circle" class="w-4 h-4 text-emerald-400"></i>
          ${escapeHtml(item.ownerName)}님과 채팅하기 (${selectedDuration} 대여)
        </button>
      `;

      document.getElementById('item-modal').classList.remove('hidden');
      lucide.createIcons();
    };

    window.selectDuration = function(dur) {
      selectedDuration = dur;
      document.querySelectorAll('.dur-btn').forEach(btn => {
        const isTarget = btn.dataset.dur === dur;
        btn.className = `dur-btn py-2.5 rounded-xl text-xs font-extrabold border transition ${
          isTarget
            ? 'bg-slate-900 text-white border-slate-900'
            : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
        }`;
      });
      const chatBtn = document.getElementById('modal-chat-btn');
      if (chatBtn) {
        const currentText = chatBtn.textContent.trim();
        const namePart = currentText.split('님과')[0];
        chatBtn.innerHTML = `
          <i data-lucide="message-circle" class="w-4 h-4 text-emerald-400"></i>
          ${escapeHtml(namePart)}님과 채팅하기 (${selectedDuration} 대여)
        `;
        lucide.createIcons();
      }
    };

    window.closeItemModal = function() {
      document.getElementById('item-modal').classList.add('hidden');
    };

    // ==================== REALTIME CHAT LOGIC (FIRESTORE) ====================
    window.startChatWithOwner = async function(itemId) {
      const item = rentalItems.find(i => i.id === itemId);
      if (!item) return;

      const roomId = `item_${item.id}`;
      const roomRef = doc(db, "chatRooms", roomId);
      const existing = chatRooms.find(r => r.id === roomId);

      const firstMsg = {
        sender: 'me',
        text: `안녕하세요! [${item.name}] ${selectedDuration} 대여하고 싶습니다. ${item.location}에서 뵐 수 있을까요?`,
        time: getCurrentTime()
      };

      if (!existing) {
        await setDoc(roomRef, {
          itemId: item.id,
          itemName: item.name,
          location: item.location,
          ownerName: item.ownerName,
          messages: [
            {
              sender: 'other',
              text: `안녕하세요! ${item.ownerName}입니다. [${item.name}] 대여 문의 주시면 ${item.location}에서 전달해드릴게요.`,
              time: getCurrentTime()
            },
            firstMsg
          ],
          updatedAt: serverTimestamp()
        });
      } else {
        await setDoc(roomRef, {
          messages: arrayUnion(firstMsg),
          updatedAt: serverTimestamp()
        }, { merge: true });
      }

      activeChatRoomId = roomId;
      closeItemModal();
      switchTab('chat');
    };

    function renderChatRooms() {
      const container = document.getElementById('chat-room-list');
      if (!chatRooms.length) {
        container.innerHTML = `<span class="text-xs text-slate-400">아직 채팅방이 없습니다.</span>`;
        return;
      }
      container.innerHTML = chatRooms.map(room => {
        const isActive = room.id === activeChatRoomId;
        return `
          <button
            type="button"
            onclick="selectChatRoom('${room.id}')"
            class="shrink-0 px-3 py-2 rounded-xl border text-left transition ${
              isActive
                ? 'bg-slate-900 text-white border-slate-900 shadow-2xs'
                : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
            }"
          >
            <p class="text-xs font-extrabold">${escapeHtml(room.ownerName)} · ${escapeHtml(room.location)}</p>
            <p class="text-[10px] ${isActive ? 'text-emerald-300' : 'text-slate-400'} truncate max-w-[130px]">
              ${escapeHtml(room.itemName)}
            </p>
          </button>
        `;
      }).join('');
    }

    window.selectChatRoom = function(roomId) {
      activeChatRoomId = roomId;
      renderChatRooms();
      renderActiveChat();
    };

    function renderActiveChat() {
      const room = chatRooms.find(r => r.id === activeChatRoomId) || chatRooms[0];
      const headerEl = document.getElementById('active-chat-header');
      const msgBox = document.getElementById('chat-messages');

      if (!room) {
        headerEl.innerHTML = `<p class="text-xs text-slate-500">물품에서 대여 채팅을 시작해 보세요.</p>`;
        msgBox.innerHTML = '';
        return;
      }

      headerEl.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-8 h-8 rounded-full bg-white border border-emerald-200 text-emerald-700 flex items-center justify-center font-extrabold text-xs shrink-0">
              ${escapeHtml((room.ownerName || '?').charAt(0))}
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-xs font-extrabold text-slate-900 truncate">${escapeHtml(room.ownerName)}</span>
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-white text-emerald-700 border border-emerald-200">${escapeHtml(room.location)}</span>
              </div>
              <p class="text-[11px] font-medium text-slate-600 truncate mt-0.5">
                ${escapeHtml(room.itemName)}
              </p>
            </div>
          </div>
        </div>
      `;

      const messages = Array.isArray(room.messages) ? room.messages : [];
      msgBox.innerHTML = messages.map(m => {
        if (m.sender === 'me') {
          return `
            <div class="flex flex-col items-end">
              <span class="text-[10px] text-slate-400 mb-0.5">나 · ${escapeHtml(m.time || '')}</span>
              <div class="bg-slate-900 text-white px-3.5 py-2.5 rounded-2xl rounded-tr-xs text-xs leading-relaxed shadow-2xs max-w-[82%]">
                ${escapeHtml(m.text)}
              </div>
            </div>
          `;
        }
        return `
          <div class="flex flex-col items-start">
            <span class="text-[10px] text-slate-400 mb-0.5">${escapeHtml(room.ownerName)} · ${escapeHtml(m.time || '')}</span>
            <div class="bg-white border border-slate-200/90 text-slate-800 px-3.5 py-2.5 rounded-2xl rounded-tl-xs text-xs leading-relaxed shadow-2xs max-w-[82%]">
              ${escapeHtml(m.text)}
            </div>
          </div>
        `;
      }).join('');

      msgBox.scrollTop = msgBox.scrollHeight;
      lucide.createIcons();
    }

    window.sendChatMessage = async function(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const room = chatRooms.find(r => r.id === activeChatRoomId) || chatRooms[0];
      if (!room) return;

      await setDoc(doc(db, "chatRooms", room.id), {
        messages: arrayUnion({
          sender: 'me',
          text,
          time: getCurrentTime()
        }),
        updatedAt: serverTimestamp()
      }, { merge: true });

      input.value = '';
    };

    window.insertQuickText = function(text) {
      const input = document.getElementById('chat-input');
      input.value = text;
      input.focus();
    };

    // ==================== UTILITIES ====================
    function getCurrentTime() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2400);
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }
  </script>
</body>
</html>
