<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>잇다 (ITDA) - 부경대학교 물품 대여</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans KR"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body {
      background-color: #F4F5F7;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="font-sans text-slate-900 antialiased flex justify-center min-h-screen">

  <!-- Mobile App Shell Container -->
  <div class="w-full max-w-[430px] bg-white min-h-screen sm:min-h-[844px] sm:my-4 sm:rounded-[36px] sm:shadow-2xl sm:border sm:border-slate-200/80 relative flex flex-col overflow-hidden">

    <!-- 1. Top Header -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-100 px-5 pt-4 pb-3 flex items-center justify-between">
      <button onclick="switchTab('home')" class="flex items-center gap-2 text-left focus:outline-none">
        <span class="font-extrabold text-[19px] tracking-tight text-slate-900">잇다</span>
        <span class="px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-600 text-[11px] font-bold">
          부경대 물품대여
        </span>
      </button>
      <button
        type="button"
        onclick="switchTab('upload')"
        class="px-3 py-1.5 rounded-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center gap-1 active:scale-95 transition"
      >
        <i data-lucide="plus" class="w-3.5 h-3.5 text-emerald-400"></i>
        물품 등록
      </button>
    </header>

    <!-- Main Scrollable Content Area -->
    <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar pb-24">

      <!-- ==================== TAB 1: HOME ==================== -->
      <section id="tab-home" class="px-5 pt-4 pb-6 space-y-4">

        <!-- Title & Search -->
        <div class="space-y-3">
          <h1 class="text-[20px] font-extrabold tracking-tight text-slate-900">
            어떤 물품이 필요하신가요?
          </h1>
          <div class="relative">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input
              id="search-input"
              type="text"
              oninput="handleSearchInput()"
              placeholder="물품명, 세부 분류, 장소 검색..."
              class="w-full pl-10 pr-9 py-2.5 bg-slate-100 rounded-xl text-[13.5px] text-slate-800 placeholder:text-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 border border-transparent transition"
            />
            <button
              id="clear-search-btn"
              onclick="clearSearch()"
              class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1"
            >
              <i data-lucide="x-circle" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Category Tabs -->
        <div class="space-y-2">
          <div id="category-tabs" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            <!-- Injected by JS -->
          </div>
          <!-- Sub-category Chips (선택된 카테고리에 세부 항목이 있을 때 표시) -->
          <div id="sub-category-chips" class="hidden flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-0.5">
            <!-- Injected by JS -->
          </div>
        </div>

        <!-- Location Filter Pills & Count -->
        <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-100">
          <div id="location-pills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
            <!-- Injected by JS -->
          </div>
          <span id="item-count-label" class="shrink-0 text-[11.5px] font-bold text-slate-400">
            총 0개
          </span>
        </div>

        <!-- Rental Items List -->
        <div id="items-list" class="space-y-2.5">
          <!-- Injected by JS -->
        </div>

      </section>

      <!-- ==================== TAB 2: UPLOAD (대여물품 업로드) ==================== -->
      <section id="tab-upload" class="hidden px-5 pt-4 pb-8 space-y-4">
        <div class="space-y-1">
          <h2 class="text-[19px] font-extrabold text-slate-900">대여물품 업로드</h2>
          <p class="text-xs text-slate-500">학우들과 나눌 물품 정보를 입력해 주세요. 이름만 공개됩니다.</p>
        </div>

        <form id="upload-form" onsubmit="handleUploadSubmit(event)" class="space-y-4">
          <!-- 1. 등록자 이름 -->
          <div>
            <label class="block text-xs font-extrabold text-slate-800 mb-1.5">
              등록자 이름 <span class="text-emerald-600">*</span>
            </label>
            <input
              id="upload-owner"
              type="text"
              required
              placeholder="예: 김민수"
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:bg-white focus:border-emerald-500 transition"
            />
          </div>

          <!-- 2. 카테고리 선택 -->
          <div>
            <label class="block text-xs font-extrabold text-slate-800 mb-1.5">
              카테고리 선택 <span class="text-emerald-600">*</span>
            </label>
            <div id="upload-cat-grid" class="grid grid-cols-2 gap-2">
              <!-- Injected by JS -->
            </div>
          </div>

          <!-- 3. 세부 물품명 -->
          <div>
            <label class="block text-xs font-extrabold text-slate-800 mb-1.5">
              세부 물품명 <span class="text-emerald-600">*</span>
            </label>
            <input
              id="upload-name"
              type="text"
              required
              placeholder="예: C타입 충전기, 공학용 계산기, 선형대수학 전공책 등"
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:bg-white focus:border-emerald-500 transition"
            />
          </div>

          <!-- 4. 대여 장소 -->
          <div>
            <label class="block text-xs font-extrabold text-slate-800 mb-1.5">
              대여 장소 <span class="text-emerald-600">*</span>
            </label>
            <div id="upload-loc-grid" class="grid grid-cols-3 gap-2">
              <!-- Injected by JS -->
            </div>
          </div>

          <!-- 5. 대여 가능 수량 -->
          <div>
            <label class="block text-xs font-extrabold text-slate-800 mb-1.5">
              대여 가능 수량
            </label>
            <div class="flex items-center gap-2">
              <input
                id="upload-qty"
                type="number"
                min="1"
                max="20"
                value="1"
                required
                class="w-28 px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm font-bold text-slate-900 focus:outline-none focus:bg-white focus:border-emerald-500 transition"
              />
              <span class="text-xs font-semibold text-slate-500">개</span>
            </div>
          </div>

          <!-- 6. 간단한 설명 / 상태 메모 -->
          <div>
            <label class="block text-xs font-extrabold text-slate-800 mb-1.5">
              간단한 설명 / 상태 메모
            </label>
            <textarea
              id="upload-desc"
              rows="3"
              placeholder="물품 상태나 전달 가능한 시간대를 간단히 적어주세요."
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:bg-white focus:border-emerald-500 transition resize-none"
            ></textarea>
          </div>

          <button
            type="submit"
            class="w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow-sm active:scale-[0.99] transition"
          >
            물품 등록 완료하기
          </button>
        </form>
      </section>

      <!-- ==================== TAB 3: CHAT (이름 기반 1:1 인앱 채팅) ==================== -->
      <section id="tab-chat" class="hidden flex flex-col h-full bg-slate-50">
        <!-- Chat Room Selector -->
        <div class="bg-white border-b border-slate-200/80 px-4 py-3">
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-xs font-bold text-slate-500">대여 채팅 목록</h2>
            <span class="text-[11px] font-semibold text-emerald-600">인앱 1:1 대화</span>
          </div>
          <div id="chat-room-list" class="flex gap-2 overflow-x-auto no-scrollbar pb-0.5">
            <!-- Injected by JS -->
          </div>
        </div>

        <!-- Active Partner Info Banner (이름 & 물품 정보만 표시) -->
        <div id="active-chat-header" class="bg-emerald-50/70 border-b border-emerald-100 px-4 py-3">
          <!-- Injected by JS -->
        </div>

        <!-- Chat Messages Area -->
        <div id="chat-messages" class="flex-1 p-4 space-y-3 overflow-y-auto min-h-[380px] max-h-[470px]">
          <!-- Injected by JS -->
        </div>

        <!-- Quick Replies & Message Input -->
        <div class="bg-white border-t border-slate-200/80 p-3 space-y-2">
          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
            <button type="button" onclick="insertQuickText('지금 바로 대여 장소로 나갈 수 있어요!')" class="shrink-0 px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-[11px] font-medium hover:bg-slate-200/70 transition">
              지금 나갈 수 있어요
            </button>
            <button type="button" onclick="insertQuickText('반납 시간 맞춰서 같은 장소로 갈게요.')" class="shrink-0 px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-[11px] font-medium hover:bg-slate-200/70 transition">
              반납 시간 맞출게요
            </button>
            <button type="button" onclick="insertQuickText('감사합니다! 잘 쓰고 깨끗하게 반납할게요.')" class="shrink-0 px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-[11px] font-medium hover:bg-slate-200/70 transition">
              잘 쓰고 반납할게요
            </button>
          </div>

          <form onsubmit="sendChatMessage(event)" class="flex items-center gap-2">
            <input
              id="chat-input"
              type="text"
              placeholder="메시지를 입력하세요..."
              class="flex-1 px-3.5 py-2.5 rounded-xl bg-slate-100 text-sm focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-500/20 border border-transparent focus:border-emerald-500 transition"
            />
            <button type="submit" class="px-4 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold shrink-0 active:scale-95 transition">
              전송
            </button>
          </form>
        </div>
      </section>

    </main>

    <!-- 5. Bottom Navigation Bar (홈 / 물품등록 / 채팅) -->
    <nav class="sticky bottom-0 z-30 bg-white/95 backdrop-blur-md border-t border-slate-100 px-4 py-2.5 grid grid-cols-3 items-center">
      <button onclick="switchTab('home')" data-tab="home" class="nav-btn flex flex-col items-center justify-center py-0.5 text-slate-900 font-extrabold">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[11px] mt-1">홈</span>
      </button>
      <button onclick="switchTab('upload')" data-tab="upload" class="nav-btn flex flex-col items-center justify-center py-0.5 text-slate-400 hover:text-slate-600">
        <i data-lucide="plus-circle" class="w-5 h-5"></i>
        <span class="text-[11px] mt-1">물품등록</span>
      </button>
      <button onclick="switchTab('chat')" data-tab="chat" class="nav-btn relative flex flex-col items-center justify-center py-0.5 text-slate-400 hover:text-slate-600">
        <i data-lucide="message-circle" class="w-5 h-5"></i>
        <span class="text-[11px] mt-1">채팅</span>
      </button>
    </nav>

    <!-- ==================== MODAL: ITEM DETAIL & RENTAL ==================== -->
    <div id="item-modal" class="hidden fixed inset-0 z-50 bg-slate-900/45 backdrop-blur-xs flex items-end sm:items-center justify-center">
      <div class="w-full max-w-[430px] bg-white rounded-t-3xl sm:rounded-3xl p-5 animate-slide-up max-h-[90vh] overflow-y-auto">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4 sm:hidden"></div>
        <div id="item-modal-body">
          <!-- Injected by JS -->
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg whitespace-nowrap">
    </div>

  </div>

      document.querySelectorAll('.nav-btn').forEach(btn => {

        btn.classList.toggle('text-slate-900', isActive);
        btn.classList.toggle('font-extrabold', isActive);

    // ==================== ITEMS LIST RENDERING ====================

      const filtered = rentalItems.filter(item => {
        const matchCat = selectedCategory === '전체' || item.category === selectedCategory;
        const matchSub = selectedSubCategory === '전체' || item.subCategory === selectedSubCategory;
        const matchLoc = selectedLocation === '전체' || item.location === selectedLocation;
        const matchQuery =
          !query ||
          item.name.toLowerCase().includes(query) ||
          item.category.toLowerCase().includes(query) ||
          item.subCategory.toLowerCase().includes(query) ||
          item.location.includes(query);
        return matchCat && matchSub && matchLoc && matchQuery;
      });

      document.getElementById('item-count-label').textContent = `총 ${filtered.length}개`;
      const container = document.getElementById('items-list');

      if (filtered.length === 0) {
        container.innerHTML = `

    function getCategoryIcon(cat) {
      const map = {
        '전자기기': 'smartphone',
        '학습용품': 'calculator',
        '건강/위생용품': 'heart-pulse',
        '생활용품': 'umbrella'
      };
      return map[cat] || 'package';
    }

    function handleUploadSubmit(e) {
      e.preventDefault();

      const ownerName = document.getElementById('upload-owner').value.trim();
      const itemName = document.getElementById('upload-name').value.trim();
      const quantity = parseInt(document.getElementById('upload-qty').value, 10) || 1;
      const descInput = document.getElementById('upload-desc').value.trim();

      if (!ownerName || !itemName) {
        showToast('등록자 이름과 세부 물품명을 입력해 주세요.');
        return;
      }

      // 세부 분류 자동 매칭 (일치 키워드가 없으면 카테고리명으로 표시)
      const catGroup = categoryGroups.find(c => c.id === uploadSelectedCategory);
      let matchedSub = uploadSelectedCategory;
      if (catGroup && catGroup.subItems.length > 0) {
        const found = catGroup.subItems.find(
          sub => sub !== '전체' && itemName.toLowerCase().includes(sub.toLowerCase())
        );
        if (found) matchedSub = found;
      }

      const newItem = {
        id: Date.now(),
        name: itemName,
        category: uploadSelectedCategory,
        subCategory: matchedSub,
        location: uploadSelectedLocation,
        quantity: quantity,
        ownerName: ownerName,
        icon: getCategoryIcon(uploadSelectedCategory),
        desc: descInput || `${uploadSelectedLocation}에서 대여 가능합니다. 채팅으로 편하게 문의해 주세요.`
      };

      rentalItems.unshift(newItem);

      // 폼 초기화
      document.getElementById('upload-form').reset();
      document.getElementById('upload-qty').value = 1;
      uploadSelectedCategory = '전자기기';
      uploadSelectedLocation = '백경광장';
      renderUploadFormOptions();

      // 홈 화면 필터 초기화 후 새 목록 반영 및 이동
      selectedCategory = '전체';
      selectedSubCategory = '전체';
      selectedLocation = '전체';
      renderCategoryTabs();
      renderLocationPills();
      renderItemsList();

      switchTab('home');
      showToast(`'${newItem.name}' 물품이 등록되었습니다!`);
    }

    // ==================== NAME-BASED IN-APP CHAT LOGIC ====================
    function startChatWithOwner(itemId) {
      const item = rentalItems.find(i => i.id === itemId);
      if (!item) return;

      let room = chatRooms.find(r => r.itemId === item.id);
      if (!room) {
        room = {
          id: Date.now(),
          itemId: item.id,
          itemName: item.name,
          location: item.location,
          ownerName: item.ownerName,
          messages: [
            {
              sender: 'other',
              text: `안녕하세요! ${item.ownerName}입니다. [${item.name}] 대여 문의 주시면 ${item.location}에서 전달해드릴게요.`,
              time: getCurrentTime()
            }
          ]
        };
        chatRooms.unshift(room);
      }

      room.messages.push({
        sender: 'me',
        text: `안녕하세요! [${item.name}] ${selectedDuration} 대여하고 싶습니다. ${item.location}에서 뵐 수 있을까요?`,
        time: getCurrentTime()
      });

      activeChatRoomId = room.id;
      closeItemModal();
      renderChatRooms();
      renderActiveChat();
      switchTab('chat');
    }

    function renderChatRooms() {
      const container = document.getElementById('chat-room-list');
      container.innerHTML = chatRooms.map(room => {
        const isActive = room.id === activeChatRoomId;
        return `

              isActive
                ? 'bg-slate-900 text-white border-slate-900 shadow-2xs'
                : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'

              ${room.itemName}
            </p>
          </button>
        `;
      }).join('');
    }

    function selectChatRoom(roomId) {
      activeChatRoomId = roomId;
      renderChatRooms();
      renderActiveChat();

    function renderActiveChat() {

      const headerEl = document.getElementById('active-chat-header');

            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-xs font-extrabold text-slate-900 truncate">${room.ownerName}</span>
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-white text-emerald-700 border border-emerald-200">${room.location}</span>
              </div>
              <p class="text-[11px] font-medium text-slate-600 truncate mt-0.5">
                ${room.itemName}
              </p>
            </div>
          </div>
        </div>
      `;

      const msgBox = document.getElementById('chat-messages');
      msgBox.innerHTML = room.messages.map(m => {
        if (m.sender === 'me') {
          return `
            <div class="flex flex-col items-end">
              <span class="text-[10px] text-slate-400 mb-0.5">나 · ${m.time}</span>
              <div class="bg-slate-900 text-white px-3.5 py-2.5 rounded-2xl rounded-tr-xs text-xs leading-relaxed shadow-2xs max-w-[82%]">
                ${m.text}
              </div>
            </div>
          `;
        }
        return `
          <div class="flex flex-col items-start">
            <span class="text-[10px] text-slate-400 mb-0.5">${room.ownerName} · ${m.time}</span>
            <div class="bg-white border border-slate-200/90 text-slate-800 px-3.5 py-2.5 rounded-2xl rounded-tl-xs text-xs leading-relaxed shadow-2xs max-w-[82%]">
              ${m.text}
            </div>
          </div>
        `;
      }).join('');

      msgBox.scrollTop = msgBox.scrollHeight;
      lucide.createIcons();
    }

    function sendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const room = chatRooms.find(r => r.id === activeChatRoomId);
      if (!room) return;

      room.messages.push({
        sender: 'me',
        text,
        time: getCurrentTime()
      });

      input.value = '';
      renderActiveChat();
    }

    function insertQuickText(text) {
      const input = document.getElementById('chat-input');
      input.value = text;
      input.focus();
    }

    // ==================== UTILITIES ====================
    function getCurrentTime() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2400);
    }



    localStorage.setItem('itda_latest_user_msg', JSON.stringify({ text: 보낸메시지변수, time: Date.now() }));
